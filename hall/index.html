<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pixel Campfire — Arcade Hall</title>
<!-- Монетка во вкладке: заодно снимает вечный 404 на /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb02e' stroke='%23b8791a' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='14' font-family='monospace' text-anchor='middle' fill='%236b4708'%3E25%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════ КАССА (вестибюль) ══════════════ -->
<section id="lobby" class="scene">
  <div class="marquee-sign">
    <div class="neon-line small">THE PIXEL CAMPFIRE</div>
    <div class="neon-line big">ARCADE</div>
    <div class="neon-sub">монеты · автоматы · истории</div>
  </div>

  <div class="booth">
    <div class="booth-roof"></div>
    <div class="booth-window">
      <div class="cashier-glass">
        <div class="booth-title">К А С С А</div>
        <div class="price-card">
          <span class="usd">$1</span>
          <span class="arrow">→</span>
          <span class="coins-price">4 четвертака</span>
        </div>
        <button id="buyBtn" class="buy-btn">КУПИТЬ МОНЕТЫ</button>
        <div id="cashierNote" class="paypal-note">касса просыпается…</div>
      </div>
      <div class="booth-slot"></div>
    </div>
    <div class="booth-legs"></div>
  </div>

  <div class="lobby-hint">Лекции у автоматов — бесплатно. Играть — за монетку.</div>
  <button id="enterHall" class="enter-btn">ВОЙТИ В ЗАЛ ▸</button>
</section>

<!-- ══════════════ ЗАЛ (карусель автоматов) ══════════════ -->
<section id="hall" class="scene hidden">
  <header class="hall-head">
    <button id="backLobby" class="ghost-btn">◂ касса</button>
    <div class="hall-title">ЗАЛ №1</div>
    <div id="wallet" class="wallet" title="Твои четвертаки">
      <div id="coinStack" class="coin-stack"></div>
      <div id="coinCount" class="coin-count">0</div>
    </div>
  </header>

  <div class="carousel-wrap">
    <button class="car-arrow" id="prevCab">◂</button>
    <div id="carousel" class="carousel"></div>
    <button class="car-arrow" id="nextCab">▸</button>
  </div>

  <div class="hall-hint" id="hallHint">Листай зал. Схвати монетку из стакана и сунь её в щель автомата.</div>
</section>

<!-- Перетаскиваемая монетка -->
<div id="dragCoin" class="drag-coin hidden">25¢</div>

<!-- Экскурсовод -->
<aside id="docent" class="docent hidden">
  <header class="docent-head">
    <div id="docentTitle" class="docent-title">—</div>
    <button id="docentClose" class="ghost-btn">✕</button>
  </header>
  <div class="docent-lang">
    <label><input type="radio" name="lang" id="langEn" checked> EN</label>
    <label><input type="radio" name="lang" id="langRu"> RU</label>
    <button id="speakBtn" class="speak-btn">▶ АУДИОЛЕКЦИЯ</button>
  </div>
  <pre id="docentBody" class="docent-body"></pre>
  <div class="docent-note">Голос: браузерный. Студийная озвучка (HF TTS) — в пути.</div>
</aside>

<script src="config.js"></script>
<script src="wallet.js"></script>
<script src="app.js"></script>
</body>
</html>
